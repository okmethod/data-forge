# =============================================================================
# 公開範囲ポリシー（Single Source of Truth）
# =============================================================================
# ダッシュボードの公開ビルド（build/data/**/*.parquet）に載せてよい地域粒度を
# 定義する唯一の場所。各 sources/*.sql の絞り込みは「このポリシーに適合すべき
# 実装」であり定義ではない。生成物が規約を守っているかを
# scripts/leak_gate.py が検査する（ゲートはここを読むだけ）。
#
# 判定ルール（ゲート側に固定）:
#   市区町村粒度コード = 5桁 かつ 末尾3桁 ≠ 000
#     （県コード XX000・全国 00000 は市区町村粒度ではない＝常に許可）
#   市区町村粒度コードは allow_municipalities に列挙されたもの以外は「流出」とみなす。
#
# 公開範囲を広げる/狭めるときは allow_municipalities を編集する（＝ここが唯一の定義）。

# 検査対象の地域コード列。これ以外の列は走査しない
# （人口・年など数値列を市区町村コードと誤検知しないため）。
area_code_columns:
  - area_code
  - pref_code

# 個別に公開を許可する市区町村コード（5桁・文字列）。
allow_municipalities:
  - "12231"   # 千葉県 印西市（デモ用サンプル市）

name: census_labor_force
type: duckdb
options:
  # 労働力状態(3区分)，男女別人口（1950〜2020）。市区町村は持たない（就業状態等基本集計）。
  # 排他粒度のため全国=census_labor_force_national_timeseries／県=census_labor_force_prefecture_timeseries に分離済。
  # .sql で両 parquet を union し「全国(00000)＋47県」の1論理テーブルへ合成する。
  # data/ は非コミットのためローカル出力前提。
  filename: ':memory:'

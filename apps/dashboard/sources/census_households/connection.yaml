name: census_households
type: duckdb
options:
  # 世帯の種類別 世帯数・世帯人員（1960〜2020）。市区町村は持たない（ソース非対称）。
  # 排他粒度のため全国=census_households_national_timeseries／県=census_households_prefecture_timeseries に分離済。
  # .sql で両 parquet を union し「全国(00000)＋47県」の1論理テーブルへ合成する。
  # data/ は非コミットのためローカル出力前提。
  filename: ':memory:'

name: census_industry
type: duckdb
options:
  # 産業(大分類)×男女別就業者数（全国1995〜／都道府県2005〜2020）。市区町村は持たない。
  # 排他粒度のため全国=census_industry_national_timeseries／県=census_industry_prefecture_timeseries に分離済。
  # .sql で両 parquet を union し「全国(00000)＋47県」の1論理テーブルへ合成する。
  # data/ は非コミットのためローカル出力前提。
  filename: ':memory:'
